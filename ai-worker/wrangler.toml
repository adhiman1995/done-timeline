# Ticked AI proxy. Deploy: npx wrangler deploy   ·   Secret: npx wrangler secret put GROQ_API_KEY
name = "ticked-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
FIREBASE_PROJECT_ID = "timeline-project-9286d"
GROQ_MODEL = "llama-3.3-70b-versatile"
ALLOWED_ORIGINS = "https://adhiman1995.github.io,http://localhost:5173"

# 10 AI requests per user per minute.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
